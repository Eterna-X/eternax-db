name: CI
on:
  push: {branches: [main], tags: ['v*']}
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PACKAGES_USER: ${{ github.actor }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew spotlessCheck build --console=plain      # tests use an embedded PostgreSQL
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PACKAGES_USER: ${{ github.actor }}
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      # tag v1.2.3 publishes version 1.2.3 of the eternax-db jar
      - run: ./gradlew publish -Pversion=${GITHUB_REF_NAME#v} --console=plain
